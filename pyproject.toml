[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veep"
version = "0.4.4"
description = "Python SDK for Vector Panda vector search"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Vector Panda", email = "hello@vectorpanda.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
]
keywords = ["vector", "search", "embeddings", "similarity", "ai"]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
pandas = [
    "pandas>=1.5",
    "pyarrow>=10.0",
]
dev = [
    "pytest>=7.0",
    "responses>=0.23",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
# Default ruleset (E, F, W) plus a few low-noise extras useful for an SDK:
# I = isort import ordering, B = bugbear, UP = pyupgrade.
select = ["E", "F", "W", "I", "B", "UP"]
# E501: long lines in test files (mock JSON tends to be wide).
extend-ignore = ["E501"]

[project.urls]
Homepage = "https://vectorpanda.com"
Documentation = "https://github.com/vectorpanda/veep"
Repository = "https://github.com/vectorpanda/veep"
Issues = "https://github.com/vectorpanda/veep/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/veep"]
